<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>الصفحة غير موجودة — صفة صلاة النبي ﷺ</title>
<script>
(function(){try{var t=localStorage.getItem("salat.theme");if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);var s=parseFloat(localStorage.getItem("salat.scale"));if(s>=0.85&&s<=1.35)document.documentElement.style.setProperty("--scale",s);}catch(e){}})();
</script>
<link rel="stylesheet" href="/sifat-salah-al-nabi/assets/css/fonts.css?v=1.4.0">
<link rel="stylesheet" href="/sifat-salah-al-nabi/assets/css/style.css?v=1.4.0">
<meta name="theme-color" content="#1D6B50">
<style>
  body { background: var(--bg); color: var(--ink); }
  .notfound { max-width: 44rem; margin: 0 auto; padding: clamp(3rem, 12vh, 8rem) 1.25rem; text-align: center; }
  .notfound .mark { width: 64px; height: 64px; margin: 0 auto 1.2rem; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(145deg, var(--accent), var(--gold)); color: #fff; }
  .notfound .mark svg { width: 36px; height: 36px; }
  .notfound h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); margin: 0 0 .8rem; }
  .notfound p { color: var(--ink-soft); line-height: 1.9; max-width: 46ch; margin: 0 auto; }
  .notfound a { display: inline-block; margin-top: 1.4rem; padding: .7rem 1.25rem; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; font-family: var(--font-ui); }
  .notfound a:hover { background: var(--accent-strong, var(--accent)); }
</style>
</head>
<body>
<main class="notfound" id="main">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.5c1.8 1.5 2.6 3 2.6 4.8 0 2.2-1.1 3.6-2.6 4.9-1.5-1.3-2.6-2.7-2.6-4.9 0-1.8.8-3.3 2.6-4.8z"/>
      <path d="M12 12.2V21M6.5 21h11"/>
    </svg>
  </div>
  <h1>الصفحة غير موجودة</h1>
  <p>ربما تغيّر الرابط أو أن الصفحة غير متاحة. يمكنك العودة إلى الكتاب ومواصلة القراءة من الصفحة الرئيسية.</p>
  <a href="/sifat-salah-al-nabi/ar/">العودة إلى الكتاب</a>
</main>
</body>
</html>
